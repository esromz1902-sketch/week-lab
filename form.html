<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form | My Website</title>

    <meta name="description" content="HTML form page for my website.">

    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <a href="index.html">My Website</a>
        </div>

        <!-- Navigation Menu -->
        <div class="menu">
            <ol>
                <li><a href="index.html">Home</a></li>
                <li><a href="tables.html">Table</a></li>
                <li><a href="form.html">Form</a></li>
            </ol>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <h1>Form</h1>
        </div>

        <!-- Main Content -->
        <div class="main">

            <h2>HTML Form</h2>

            <p>
                Please fill out the form below.
            </p>

            <form action="#" method="post">

                <!-- Name -->
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">

                <br><br>

                <!-- Email -->
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">

                <br><br>

                <!-- Password -->
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">

                <br><br>

                <!-- Date -->
                <label for="date">Date:</label>
                <input type="date" id="date" name="date">

                <br><br>

                <!-- Radio Buttons -->
                <p>Choose your favourite subject:</p>

                <input type="radio" id="html" name="subject" value="html">
                <label for="html">HTML</label>

                <input type="radio" id="css" name="subject" value="css">
                <label for="css">CSS</label>

                <input type="radio" id="javascript" name="subject" value="javascript">
                <label for="javascript">JavaScript</label>

                <br><br>

                <!-- Checkbox -->
                <input type="checkbox" id="agree" name="agree">
                <label for="agree">I agree to the terms and conditions.</label>

                <br><br>

                <!-- Message -->
                <label for="message">Message:</label>
                <br>

                <textarea id="message" name="message" rows="5" cols="40"
                    placeholder="Enter your message"></textarea>

                <br><br>

                <!-- Submit -->
                <input type="submit" value="Submit">

                <!-- Reset -->
                <input type="reset" value="Reset">

            </form>

        </div>

        <!-- Footer -->
        <div class="footer">
            &copy; 2026 My Website
        </div>

    </div>

</body>

</html>
